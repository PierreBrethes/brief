
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief: Intelligence Temporelle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --space-bg: #010409;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--space-bg);
      color: #f8fafc;
      overflow: hidden;
      margin: 0;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* FOND COSMOS DÉTAILLÉ */
    .cosmos-container {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow: hidden;
    }

    /* Étoiles générées par box-shadow pour la performance */
    .stars-layer-1 {
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow: 10vw 20vh #fff, 30vw 40vh #fff, 50vw 10vh #fff, 70vw 80vh #fff, 90vw 30vh #fff, 15vw 75vh #fff, 45vw 55vh #fff, 85vw 15vh #fff, 25vw 5vh #fff, 65vw 95vh #fff, 5vw 45vh #fff, 35vw 85vh #fff;
      animation: twinkle 5s infinite ease-in-out;
    }
    /* Plus d'étoiles avec un sélecteur complexe pour simuler la densité */
    .stars-layer-2 {
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow: 12vw 12vh #fff, 22vw 62vh #fff, 42vw 32vh #fff, 62vw 82vh #fff, 82vw 42vh #fff, 52vw 12vh #fff, 72vw 52vh #fff, 92vw 92vh #fff;
      animation: twinkle 7s infinite ease-in-out;
      opacity: 0.5;
    }

    .nebula {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(65, 105, 225, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(1, 4, 9, 1) 100%);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Animation de balayage type monitoring */
    .scanline {
      width: 100%;
      height: 2px;
      background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.1), transparent);
      position: absolute;
      top: -100px;
      animation: scan 8s linear infinite;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes scan {
      0% { top: -100px; }
      100% { top: 100vh; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
  <div class="cosmos-container">
    <div class="nebula"></div>
    <div class="stars-layer-1"></div>
    <div class="stars-layer-2" style="margin-left: 50px; margin-top: 100px;"></div>
    <div class="scanline"></div>
  </div>
  <div id="root"></div>
</body>
</html>
